name: Publish npm

# Publish only after develop → main merge, then tag / GitHub Release (v*).
on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag/release commit is on main
        run: |
          set -e
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Refusing publish: HEAD is not on origin/main. Merge develop → main, then tag/release."
            exit 1
          fi
          echo "OK: $(git rev-parse --short HEAD) is reachable from origin/main"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@yangyangxresearch"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_UPLOAD_PACKAGE }}
        run: npm publish --access public
